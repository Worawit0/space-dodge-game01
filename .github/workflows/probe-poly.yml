name: Probe Poly Pizza Asset URLs

on:
  push:
    branches:
      - chatgpt-forsaken-2d-beauty-20260919
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Probe pages
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import re, urllib.request
          urls = [
            "https://poly.pizza/bundle/Medieval-Village-Pack-NsHhjhlrfY",
            "https://poly.pizza/bundle/Ultimate-Modular-Men-Pack-ZiH8muWqwQ",
            "https://poly.pizza/bundle/Ultimate-Modular-Women-Pack-aCBDXDdTNN",
            "https://poly.pizza/m/F2LAK03B0r",
          ]
          for url in urls:
              print("====", url, "====")
              html = urllib.request.urlopen(url, timeout=30).read().decode("utf-8","ignore")
              pats = [
                  r'https?://[^"\' ]+\.(?:glb|gltf|zip)(?:\?[^"\' ]*)?',
                  r'https?://[^"\' ]*(?:download|asset|bundle)[^"\' ]*',
                  r'"[^"]*(?:glb|gltf|zip)[^"]*"'
              ]
              seen = set()
              for pat in pats:
                  for m in re.findall(pat, html, re.I):
                      if m not in seen:
                          seen.add(m)
                          print(m[:600])
                          if len(seen) >= 80:
                              break
                  if len(seen) >= 80:
                      break
          PY
