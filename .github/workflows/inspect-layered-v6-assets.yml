name: Inspect New Forsaken Assets

on:
  push:
    branches:
      - chatgpt-forsaken-layered-v6-20260920
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download asset packs
        run: |
          set -euxo pipefail
          npm install -g itchio-downloader
          mkdir -p /tmp/packs /tmp/ext
          dl () {
            key="$1"; url="$2"
            mkdir -p "/tmp/packs/$key" "/tmp/ext/$key"
            itchio-downloader --url "$url" --downloadDirectory "/tmp/packs/$key"
            z=$(find "/tmp/packs/$key" -type f ! -name '*metadata.json' | head -1)
            echo "$key archive=$z"
            file "$z"
            if file "$z" | grep -qi 'Zip archive'; then
              unzip -q "$z" -d "/tmp/ext/$key"
            else
              7z x -y "$z" -o"/tmp/ext/$key" >/dev/null
            fi
          }
          dl darkui https://hypnobius.itch.io/dark-ages-ui
          dl dungeon https://pixel-poem.itch.io/dungeon-assetpuck
          dl pixellands https://trislin.itch.io/pixel-lands-dungeons
          dl demons https://zerie.itch.io/tiny-rpg-character-asset-pack-02
          dl door https://jitsukoan.itch.io/demon-door
          dl cave https://maaot.itch.io/2d-browncave-assets
      - name: Print manifests
        run: |
          set -euxo pipefail
          for d in darkui dungeon pixellands demons door cave; do
            echo "===== $d ====="
            find "/tmp/ext/$d" -type f | sed "s#/tmp/ext/$d/##" | sort | head -300
          done

      - name: Print image dimensions
        run: |
          python3 -m pip install pillow >/dev/null
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          roots=Path('/tmp/ext')
          wanted=['32x32-Tilesheet.png','Dungeon_Tileset.png','dungeons_demo.png','dungeons_demo_animated.png','Demon_A_Idle.png','Blood Monster_A_Idle.png','!Demon Door.png','Cave - BigRocks1.png','Cave - Floor.png']
          for name in wanted:
              hits=list(roots.rglob(name))
              for p in hits:
                  try:
                      im=Image.open(p)
                      print(name, im.size, 'path=', p)
                  except Exception as e:
                      print('ERR',p,e)
          PY

      - name: Analyze Demon Door sheet
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          p=next(Path('/tmp/ext/door').rglob('!Demon Door.png'))
          im=Image.open(p).convert('RGBA')
          print('door mode/size',im.mode,im.size)
          a=im.getchannel('A')
          print('alpha extrema',a.getextrema())
          # Occupancy in a 12x8 grid helps identify the author sheet layout.
          W,H=im.size
          for gy in range(8):
              row=[]
              for gx in range(12):
                  box=(gx*W//12,gy*H//8,(gx+1)*W//12,(gy+1)*H//8)
                  crop=im.crop(box)
                  alpha=crop.getchannel('A')
                  nz=sum(1 for v in alpha.getdata() if v>8)
                  row.append(round(nz/(crop.width*crop.height),2))
              print('GRID',gy,row)
          # Find transparent separators.
          pix=a.load()
          cols=[]
          for x in range(W):
              if max(pix[x,y] for y in range(0,H,8))<=8: cols.append(x)
          rows=[]
          for y in range(H):
              if max(pix[x,y] for x in range(0,W,8))<=8: rows.append(y)
          def runs(vals):
              out=[]
              if not vals:return out
              a=b=vals[0]
              for v in vals[1:]:
                  if v==b+1:b=v
                  else:out.append((a,b));a=b=v
              out.append((a,b));return out
          print('transparent col runs',runs(cols)[:50])
          print('transparent row runs',runs(rows)[:50])
          PY
